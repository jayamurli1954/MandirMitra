name: MandirMitra CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  private-folder-guard:
    name: "Private Folder Guard"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: diff_range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD~1)"
            else
              BASE="${{ github.event.before }}"
            fi
            echo "base=${BASE}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Block private folder changes
        shell: bash
        run: |
          CHANGED="$(git diff --name-only "${{ steps.diff_range.outputs.base }}" "${{ steps.diff_range.outputs.head }}" -- \
            do_not_push_This_folder_to_GitHub || true)"

          if [ -n "${CHANGED}" ]; then
            echo "::error::Changes detected in do_not_push_This_folder_to_GitHub/. Remove these files from commit before pushing."
            echo "Blocked file changes:"
            echo "${CHANGED}"
            exit 1
          fi

          echo "Private folder guard passed."

  panchang-freeze:
    name: "Panchang Freeze Guard"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: diff_range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD~1)"
            else
              BASE="${{ github.event.before }}"
            fi
            echo "base=${BASE}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce freeze
        shell: bash
        env:
          PANCHANG_FREEZE_OVERRIDE: ${{ vars.PANCHANG_FREEZE_OVERRIDE }}
        run: |
          OVERRIDE="$(echo "${PANCHANG_FREEZE_OVERRIDE:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "${OVERRIDE}" = "true" ]; then
            echo "PANCHANG_FREEZE_OVERRIDE=true -> skipping freeze enforcement."
            exit 0
          fi

          CHANGED="$(git diff --name-only "${{ steps.diff_range.outputs.base }}" "${{ steps.diff_range.outputs.head }}" -- \
            backend/app/services/panchang/core.py \
            backend/app/services/panchang/timings.py \
            backend/app/services/panchang/calendrical.py \
            backend/app/services/panchang/constants.py \
            backend/app/services/panchang/__init__.py \
            frontend/src/components/PanchangDisplay.js || true)"

          if [ -n "${CHANGED}" ]; then
            echo "::error::Panchang module is frozen. Set repository variable PANCHANG_FREEZE_OVERRIDE=true only for intentional approved edits."
            echo "Blocked file changes:"
            echo "${CHANGED}"
            exit 1
          fi

          echo "Freeze guard passed: no frozen Panchang files changed."
  # ────────────────────────────────────────────────
  # JOB 1: Backend — Lint + Security + Tests
  # ────────────────────────────────────────────────
  backend:
    name: "Backend (Python)"
    runs-on: ubuntu-latest
    needs: [private-folder-guard, panchang-freeze]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mandirmitra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/mandirmitra_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET_KEY: ci-test-jwt-secret-key
      DEBUG: "True"
      DEPLOYMENT_MODE: standalone

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pbr
          pip install -r requirements.txt

      - name: Lint with Flake8
        working-directory: backend
        run: |
          flake8 app/ --max-line-length=120 --exclude=__pycache__,migrations,alembic \
            --ignore=E501,W503,E711,E712,E722,F401,W291,W293,W391,E129,E203,E302,E402,F402,F541,F811,F841 --count --statistics

      - name: Type check with MyPy
        working-directory: backend
        run: |
          mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # Warn, don't fail, until we have full type coverage

      - name: Security scan with Bandit
        working-directory: backend
        run: |
          bandit -r app/ -ll -x app/tests
        continue-on-error: false

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        run: |
          pip-audit --requirement requirements.txt --skip-editable
        continue-on-error: true   # Warn for now, lock down before go-live

      - name: Run database migrations
        working-directory: backend
        run: |
          python scripts/ci_create_tables.py
          alembic stamp head

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing \
            --tb=short -q
        continue-on-error: true   # Allow failures while we build out test coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ────────────────────────────────────────────────
  # JOB 2: Frontend — Lint + Build
  # ────────────────────────────────────────────────
  frontend:
    name: "Frontend (React)"
    runs-on: ubuntu-latest
    needs: [private-folder-guard, panchang-freeze]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint with ESLint
        working-directory: frontend
        run: npx eslint src/ --ext .js,.jsx --max-warnings=0
        continue-on-error: true

      - name: Dependency vulnerability scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build production bundle
        working-directory: frontend
        env:
          REACT_APP_API_URL: https://placeholder.railway.app
          REACT_APP_NAME: MandirMitra
          REACT_APP_VERSION: ${{ github.ref_name }}
          CI: false   # Don't treat warnings as errors during CI build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ────────────────────────────────────────────────
  # JOB 3: Security Audit Summary
  # ────────────────────────────────────────────────
  security-summary:
    name: "Security Summary"
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Print security summary
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║   MandirMitra Security CI Summary   ║"
          echo "╚══════════════════════════════════════╝"
          echo "Backend job:  ${{ needs.backend.result }}"
          echo "Frontend job: ${{ needs.frontend.result }}"
          echo ""
          echo "✅ Checks run: Bandit, pip-audit, npm audit, Flake8, ESLint"
