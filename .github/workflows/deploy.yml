name: Production Deploy

on:
  workflow_run:
    workflows: ["MandirMitra CI/CD Pipeline"]
    types: [completed]

concurrency:
  group: production-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-vercel:
    name: "Deploy Vercel"
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured. Skipping Vercel deploy."
            exit 0
          fi

          curl --fail --show-error --silent --retry 3 --retry-delay 5 -X POST "$VERCEL_DEPLOY_HOOK_URL"
