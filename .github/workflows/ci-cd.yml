name: MandirMitra CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ────────────────────────────────────────────────
  # JOB 1: Backend — Lint + Security + Tests
  # ────────────────────────────────────────────────
  backend:
    name: "Backend (Python)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mandirmitra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/mandirmitra_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET_KEY: ci-test-jwt-secret-key
      DEBUG: "True"
      DEPLOYMENT_MODE: standalone

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pbr
          pip install -r requirements.txt

      - name: Lint with Flake8
        working-directory: backend
        run: |
          flake8 app/ --max-line-length=120 --exclude=__pycache__,migrations,alembic \
            --ignore=E501,W503,E711,E712,E722,F401,W291,W293,W391,E129,E203,E302,E402,F402,F541,F811,F841 --count --statistics

      - name: Type check with MyPy
        working-directory: backend
        run: |
          mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # Warn, don't fail, until we have full type coverage

      - name: Security scan with Bandit
        working-directory: backend
        run: |
          bandit -r app/ -ll -x app/tests
        continue-on-error: false

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        run: |
          pip-audit --requirement requirements.txt --skip-editable
        continue-on-error: true   # Warn for now, lock down before go-live

      - name: Run database migrations
        working-directory: backend
        run: |
          # Step 1: Create all base tables via ORM (handles fresh empty DB)
          python -c "
          import os
          os.environ.setdefault('DATABASE_URL', 'postgresql://testuser:testpass@localhost:5432/mandirmitra_test')
          from app.core.database import Base, engine
          Base.metadata.create_all(engine)
          print('Base tables created successfully')
          "
          # Step 2: Run alembic migrations (ADD COLUMN migrations are guarded no-ops on fresh DB)
          alembic upgrade head

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing \
            --tb=short -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ────────────────────────────────────────────────
  # JOB 2: Frontend — Lint + Build
  # ────────────────────────────────────────────────
  frontend:
    name: "Frontend (React)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint with ESLint
        working-directory: frontend
        run: npx eslint src/ --ext .js,.jsx --max-warnings=0
        continue-on-error: true

      - name: Dependency vulnerability scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build production bundle
        working-directory: frontend
        env:
          REACT_APP_API_URL: https://placeholder.railway.app
          REACT_APP_NAME: MandirMitra
          REACT_APP_VERSION: ${{ github.ref_name }}
          CI: false   # Don't treat warnings as errors during CI build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ────────────────────────────────────────────────
  # JOB 3: Security Audit Summary
  # ────────────────────────────────────────────────
  security-summary:
    name: "Security Summary"
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Print security summary
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║   MandirMitra Security CI Summary   ║"
          echo "╚══════════════════════════════════════╝"
          echo "Backend job:  ${{ needs.backend.result }}"
          echo "Frontend job: ${{ needs.frontend.result }}"
          echo ""
          echo "✅ Checks run: Bandit, pip-audit, npm audit, Flake8, ESLint"
