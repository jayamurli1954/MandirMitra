version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mandirmitra-db
    environment:
      POSTGRES_USER: mandiradmin
      POSTGRES_PASSWORD: mandirpassword
      POSTGRES_DB: mandirmitra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandiradmin -d mandirmitra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mandirmitra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandirmitra-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mandiradmin:mandirpassword@db:5432/mandirmitra
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mandirmitra-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    # Required for hot-reloading in docker
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
