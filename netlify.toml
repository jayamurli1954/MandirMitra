# Frontend Netlify Deployment Configuration
# Deploys the React frontend to Netlify CDN

[build]
  base      = "frontend"
  command   = "npm ci && npm run build"
  publish   = "build"

[build.environment]
  NODE_VERSION = "18"
  CI = "false"

# SPA routing — all routes redirect to index.html for React Router
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers on all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-XSS-Protection           = "1; mode=block"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.railway.app https://*.onrender.com;"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"

# Static asset caching — JS/CSS/images get 1 year cache
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
